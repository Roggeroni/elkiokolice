        <div class="links">

            >

                Wbij na Discorda!

            <a

    <script src="script.js"></script>
    <script>

    function updateGreeting() {

        const hour = new Date().getHours();

        const greeting =
            document.getElementById("greeting");

        if (hour >= 0 && hour < 17) {

            greeting.textContent = "Dzień Dobry!";

        } else {

            greeting.textContent = "Dobry Wieczór!";

        }

    }

    updateGreeting();

</script>
